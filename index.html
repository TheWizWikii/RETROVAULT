<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 Retro Game Vault</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <div class="logo">
                <i class="fas fa-gamepad"></i>
                <h1>RETRO<span>VAULT</span></h1>
            </div>
            <div class="header-controls">
                <button id="settingsBtn" class="btn-neon btn-settings" title="Ajustes">
                    <i class="fas fa-cog"></i>
                </button>
                <button id="refreshBtn" class="btn-neon" title="Resetear filtros">
                    <i class="fas fa-undo-alt"></i> Resetear
                </button>
                <span id="gameCount" class="badge">0 juegos</span>
            </div>
        </header>

        <!-- ===== BARRA DE BÚSQUEDA Y FILTROS ===== -->
        <section class="add-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Buscar juego..." />
                <button id="searchBtn" class="btn-neon btn-add">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="filter-wrapper">
                <select id="systemSelect" class="system-select">
                    <option value="all">🎮 Todos los sistemas</option>
                </select>
            </div>
        </section>

        <!-- ===== SUGERENCIAS ===== -->
        <div id="suggestions" class="suggestions"></div>

        <!-- ===== CHIPS DE SISTEMAS ===== -->
        <div id="systemChips" class="system-chips"></div>

        <!-- ===== GRID DE JUEGOS ===== -->
        <main id="gameGrid" class="crypto-grid"></main>

        <!-- ===== MODAL DE DETALLE ===== -->
        <div id="gameModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- ===== MODAL DE AJUSTES ===== -->
        <div id="settingsModal" class="modal">
            <div class="modal-content settings-modal">
                <span class="modal-close" id="settingsClose">&times;</span>
                <h2 style="font-family:'Orbitron',sans-serif;color:#00ccff;margin-bottom:20px;">
                    <i class="fas fa-cog"></i> Ajustes
                </h2>
                
                <div class="settings-section">
                    <h3>📂 Gestión de Sistemas</h3>
                    <div class="settings-row">
                        <button id="addSystemSettingsBtn" class="btn-neon btn-system">
                            <i class="fas fa-plus-circle"></i> Añadir Sistema
                        </button>
                    </div>
                    <div id="systemList" class="system-list"></div>
                </div>

                <div class="settings-section">
                    <h3>💾 Backup & Restauración</h3>
                    <div class="settings-row">
                        <button id="exportBtn" class="btn-neon btn-export">
                            <i class="fas fa-download"></i> Exportar Backup
                        </button>
                        <button id="importBtn" class="btn-neon btn-import">
                            <i class="fas fa-upload"></i> Importar Backup
                        </button>
                        <input type="file" id="importFile" accept=".json" style="display:none;" />
                    </div>
                    <p style="color:#666;font-size:0.8rem;margin-top:8px;">
                        Exporta todos tus sistemas y configuración para restaurarlos en otro dispositivo.
                    </p>
                </div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer>
            <p>🎮 Gestor de ROMs, Ports y Homebrew · Retro Game Vault</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
