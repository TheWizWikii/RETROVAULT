<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 Retro Game Vault</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <div class="logo">
                <i class="fas fa-gamepad"></i>
                <h1>RETRO<span>VAULT</span></h1>
            </div>
            <div class="header-controls">
                <button id="refreshBtn" class="btn-neon" title="Resetear filtros">
                    <i class="fas fa-undo-alt"></i> Resetear
                </button>
                <span id="gameCount" class="badge">0 juegos</span>
            </div>
        </header>

        <!-- ===== BARRA DE BÚSQUEDA Y FILTROS ===== -->
        <section class="add-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Buscar juego..." />
                <button id="searchBtn" class="btn-neon btn-add">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="filter-wrapper">
                <select id="systemSelect" class="system-select">
                    <option value="all">🎮 Todos los sistemas</option>
                </select>
                <label class="sort-checkbox">
                    <input type="checkbox" id="sortAlphabetically" />
                    <span>🔤 A-Z</span>
                </label>
            </div>
        </section>

        <!-- ===== SUGERENCIAS ===== -->
        <div id="suggestions" class="suggestions"></div>

        <!-- ===== CHIPS DE SISTEMAS ===== -->
        <div id="systemChips" class="system-chips"></div>

        <!-- ===== GRID DE JUEGOS ===== -->
        <main id="gameGrid" class="crypto-grid"></main>

        <!-- ===== MODAL DE DETALLE ===== -->
        <div id="gameModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer>
            <p>🎮 Gestor de ROMs, Ports y Homebrew · Retro Game Vault</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
