<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>TWW Radar | Spot Scanner</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <header class="topbar">
            <div class="logo">
                <h1>TWW Radar</h1>

                <span>Spot Opportunity Scanner</span>
            </div>

            <div class="marketInfo">
                <div class="marketCard">
                    <span>BTC</span>

                    <strong id="btcPrice">--</strong>
                </div>

                <div class="marketCard">
                    <span>Fear</span>

                    <strong id="fearGreed">--</strong>
                </div>

                <div class="marketCard">
                    <span>Dominancia BTC</span>

                    <strong id="btcDominance">--</strong>
                </div>
            </div>
        </header>

        <section class="filters">
            <div>
                <label>Market Cap Máx.</label>

                <input id="maxCap" type="number" value="150" />

                <small>M$</small>
            </div>

            <div>
                <label>Volumen mínimo</label>

                <input id="minVolume" type="number" value="2" />

                <small>M$</small>
            </div>

            <div>
                <label>Buscar</label>

                <input id="searchCoin" type="text" placeholder="Buscar moneda..." />
            </div>

            <button id="refreshButton">Actualizar Radar</button>
        </section>

        <main>
            <section class="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>

                            <th>Moneda</th>

                            <th>Precio</th>

                            <th>24h</th>

                            <th>Market Cap</th>

                            <th>Spot Vol.</th>

                            <th>RSI</th>

                            <th>MACD</th>

                            <th>Score</th>

                            <th>Señal</th>
                        </tr>
                    </thead>

                    <tbody id="scannerTable"></tbody>
                </table>
            </section>

            <aside id="detailsPanel">
                <div class="coinHeader">
                    <img id="coinImage" src="" alt="" />

                    <div>
                        <h2 id="coinName">Selecciona una moneda</h2>

                        <p id="coinSymbol">--</p>
                    </div>
                </div>

                <div class="scoreBox">
                    <div class="scoreCircle">
                        <span id="coinScore"> -- </span>
                    </div>

                    <h3 id="coinSignal">Esperando...</h3>
                </div>

                <div class="infoGrid">
                    <div>
                        <label>Precio</label>

                        <strong id="detailPrice">--</strong>
                    </div>

                    <div>
                        <label>Market Cap</label>

                        <strong id="detailCap">--</strong>
                    </div>

                    <div>
                        <label>Spot Volume</label>

                        <strong id="detailSpot">--</strong>
                    </div>

                    <div>
                        <label>RSI</label>

                        <strong id="detailRSI">--</strong>
                    </div>

                    <div>
                        <label>MACD</label>

                        <strong id="detailMACD">--</strong>
                    </div>

                    <div>
                        <label>Estocástico</label>

                        <strong id="detailStoch">--</strong>
                    </div>

                    <div>
                        <label>EMA20</label>

                        <strong id="detailEMA20">--</strong>
                    </div>

                    <div>
                        <label>EMA50</label>

                        <strong id="detailEMA50">--</strong>
                    </div>

                    <div>
                        <label>EMA200</label>

                        <strong id="detailEMA200">--</strong>
                    </div>

                    <div>
                        <label>Desde ATH</label>

                        <strong id="detailATH">--</strong>
                    </div>
                </div>

                <div class="analysisBox">
                    <h3>Análisis del Radar</h3>

                    <p id="analysisText">Selecciona una moneda para ver el análisis.</p>
                </div>
            </aside>
        </main>

        <footer>TWW Radar © 2026</footer>

        <script src="config.js"></script>
        <script src="api.js"></script>
        <script src="indicators.js"></script>
        <script src="score.js"></script>
        <script src="radar.js"></script>
        <script src="app.js"></script>
    </body>
</html>
